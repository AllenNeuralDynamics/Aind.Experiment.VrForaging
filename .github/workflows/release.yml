name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes"
        required: false
        default: ""
      suffix:
        description: "Optional suffix appended to the release name"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          # Count existing tags for today and increment
          INDEX=$(git tag --list "${DATE}.*" | wc -l)
          INDEX=$((INDEX + 1))
          TAG="${DATE}.${INDEX}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass inputs via env to avoid shell injection
          NOTES: ${{ github.event.inputs.notes }}
          SUFFIX: ${{ github.event.inputs.suffix }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.tag.outputs.tag }}"
          fi

          NOTES=$(printf '%s\n\nCreated from %s' "$NOTES" "$BRANCH")

          TITLE="${{ steps.tag.outputs.tag }}"
          if [ -n "$SUFFIX" ]; then
            TITLE="${TITLE} ${SUFFIX}"
          fi

          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest
