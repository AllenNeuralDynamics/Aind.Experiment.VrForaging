name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Optional release notes"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          # Count existing tags for today and increment
          INDEX=$(git tag --list "${DATE}.*" | wc -l)
          INDEX=$((INDEX + 1))
          TAG="${DATE}.${INDEX}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.tag.outputs.tag }}"
          fi

          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "$NOTES" \
            --latest
